<!DOCTYPE html>
<html>
<head>
  <title>Scout Portal Test</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .panel { display: none; border: 1px solid #ccc; padding: 20px; margin: 10px 0; }
    .panel.active { display: block; background: #f0f0f0; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Scout Portal Debug Test</h1>

  <button onclick="testPanel('scout-law')">Test Scout Law</button>
  <button onclick="testPanel('roadmap')">Test Roadmap</button>
  <button onclick="testPanel('field-guide')">Test Field Guide</button>
  <button onclick="testPanel('knots')">Test Knots</button>

  <div id="panel-scout-law" class="panel">
    <h2>Scout Law Explorer</h2>
    <div id="law-grid"></div>
    <div id="law-detail"></div>
  </div>

  <div id="panel-roadmap" class="panel">
    <h2>Rank Roadmap</h2>
    <div id="roadmap-content"></div>
  </div>

  <div id="panel-field-guide" class="panel">
    <h2>Field Guide</h2>
    <div id="guide-grid"></div>
    <div id="guide-detail"></div>
  </div>

  <div id="panel-knots" class="panel">
    <h2>Knot Library</h2>
    <div id="knot-grid"></div>
    <div id="knot-detail"></div>
  </div>

  <div id="debug"></div>

  <script>
    // Minimal test objects
    const SL = {
      init: false,
      data: [
        { word: 'Trustworthy', icon: '🤝', color: '#1B4332', desc: 'A Scout tells the truth' }
      ],
      render() {
        document.getElementById('law-grid').innerHTML = this.data.map((l, i) =>
          `<div onclick="SL.show(${i})">${l.icon} ${l.word}</div>`
        ).join('');
        log('SL.render() called');
      },
      show(i) {
        document.getElementById('law-detail').innerHTML = `<h3>${this.data[i].word}</h3><p>${this.data[i].desc}</p>`;
        log('SL.show(' + i + ') called');
      }
    };

    const RM = {
      init: false,
      render() {
        document.getElementById('roadmap-content').innerHTML = '<div>Rank Roadmap Content</div>';
        log('RM.render() called');
      }
    };

    const FG = {
      init: false,
      render() {
        document.getElementById('guide-grid').innerHTML = '<div>Field Guide Content</div>';
        log('FG.render() called');
      }
    };

    const KL = {
      init: false,
      render() {
        document.getElementById('knot-grid').innerHTML = '<div>Knot Library Content</div>';
        log('KL.render() called');
      }
    };

    function testPanel(id) {
      log('testPanel("' + id + '") called');

      // Hide all panels
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

      // Show this panel
      const panel = document.getElementById('panel-' + id);
      if (!panel) {
        log('ERROR: Panel not found: #panel-' + id);
        return;
      }
      panel.classList.add('active');

      // Call render
      if (id === 'scout-law' && !SL.init) {
        SL.init = true;
        SL.render();
      } else if (id === 'roadmap' && !RM.init) {
        RM.init = true;
        RM.render();
      } else if (id === 'field-guide' && !FG.init) {
        FG.init = true;
        FG.render();
      } else if (id === 'knots' && !KL.init) {
        KL.init = true;
        KL.render();
      }
    }

    function log(msg) {
      const div = document.getElementById('debug');
      div.innerHTML += '<div style="padding: 5px; background: #fffacd; border: 1px solid #ccc; margin: 5px 0;">' + msg + '</div>';
      console.log(msg);
    }

    log('Test page loaded. Objects defined: SL=' + (typeof SL) + ', RM=' + (typeof RM) + ', FG=' + (typeof FG) + ', KL=' + (typeof KL));
  </script>
</body>
</html>
