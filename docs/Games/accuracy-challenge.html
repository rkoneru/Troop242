<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accuracy Challenge — Troop 242</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --teal: #0D9488; --tealp: #CCFBF1; --g: #1B4332; --gl: #52B788;
      --red: #EF4444; --bg: #F7F8F5; --w: #fff; --bd: #E2E8F0; --t: #111827; --mu: #6B7280;
      --r: 14px; --sh: 0 2px 8px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--t);
      min-height: 100vh;
      padding: 20px;
    }
    header {
      background: linear-gradient(135deg, var(--teal) 0%, #14B8A6 100%);
      color: #fff;
      padding: 40px 24px;
      text-align: center;
      border-radius: 16px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 30%, rgba(13, 148, 136, .2) 0%, transparent 55%);
      pointer-events: none;
    }
    h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }
    .sub {
      color: rgba(255, 255, 255, .7);
      font-size: 15px;
      position: relative;
      z-index: 1;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: .15s;
    }
    .back-btn:hover { background: rgba(255, 255, 255, .25); }

    .container { max-width: 700px; margin: 0 auto; }
    .game-wrapper { display: flex; flex-direction: column; gap: 32px; }

    .progress-bar {
      height: 6px;
      background: var(--bd);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--teal) 0%, #14B8A6 100%);
      transition: width 0.3s ease;
    }

    .game-card {
      background: var(--w);
      border: 2px solid var(--bd);
      border-radius: var(--r);
      padding: 32px;
      box-shadow: var(--sh);
    }

    .round-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .target-area {
      background: var(--tealp);
      border: 2px solid var(--teal);
      border-radius: 10px;
      padding: 40px;
      margin: 24px 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      min-height: 250px;
    }

    .target {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--teal);
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .target:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(13, 148, 136, .5);
    }

    .target.hit {
      background: var(--gl);
      transform: scale(0.8);
    }

    .stats-display {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 24px 0;
    }

    .stat-item {
      background: var(--tealp);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--teal);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--teal);
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      transition: all .2s ease;
    }

    .btn-primary {
      background: var(--teal);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) {
      background: #0F766E;
      transform: translateY(-2px);
    }

    .results-card {
      background: var(--tealp);
      border: 2px solid var(--teal);
      border-radius: var(--r);
      padding: 40px;
      text-align: center;
      box-shadow: var(--sh);
    }

    .score-display {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--teal);
      margin: 20px 0;
    }

    @media (max-width: 640px) {
      .target-area { grid-template-columns: repeat(4, 1fr); padding: 20px; }
      .game-card { padding: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="scout-games-hub.html" class="back-btn">← Back</a>
    <h1>🎯 Accuracy Challenge</h1>
    <p class="sub">Click the targets before time runs out</p>
  </header>

  <div class="container">
    <div id="gameContainer" class="game-wrapper">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <div id="gameCard" class="game-card">
        <div class="round-num" id="roundNum"></div>

        <div class="stats-display">
          <div class="stat-item">
            <div class="stat-label">Hits</div>
            <div class="stat-value" id="hitCount">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Time</div>
            <div class="stat-value" id="timeLeft">30</div>
          </div>
        </div>

        <div class="target-area" id="targetArea"></div>

        <button id="startBtn" class="btn btn-primary" onclick="startGame()">Start Game</button>
      </div>
    </div>

    <div id="resultsScreen" style="display: none;">
      <div class="results-card">
        <div style="font-size: 4rem; margin: 20px 0;">🎯</div>
        <div class="score-display" id="finalScore"></div>
        <p style="font-size: 1.1rem; color: var(--teal); margin: 20px 0; font-weight: 600;">targets hit</p>
        <p id="resultMessage" style="font-size: 1rem; margin: 20px 0;"></p>
        <button class="btn btn-primary" onclick="resetGame()" style="margin-top: 20px;">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    let gameActive = false;
    let hits = 0;
    let timeLeft = 30;
    let round = 1;
    let gameTimer = null;

    function startGame() {
      hits = 0;
      timeLeft = 30;
      gameActive = true;
      document.getElementById('hitCount').textContent = '0';
      document.getElementById('startBtn').disabled = true;
      createTargets();

      gameTimer = setInterval(() => {
        timeLeft--;
        document.getElementById('timeLeft').textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function createTargets() {
      const area = document.getElementById('targetArea');
      area.innerHTML = '';

      for (let i = 0; i < 25; i++) {
        const target = document.createElement('button');
        target.className = 'target';
        target.onclick = (e) => {
          e.preventDefault();
          if (gameActive) {
            target.classList.add('hit');
            hits++;
            document.getElementById('hitCount').textContent = hits;
            target.disabled = true;
          }
        };
        area.appendChild(target);
      }
    }

    function endGame() {
      gameActive = false;
      clearInterval(gameTimer);
      document.getElementById('gameContainer').style.display = 'none';
      document.getElementById('resultsScreen').style.display = 'block';

      document.getElementById('finalScore').textContent = hits;

      let message = '';
      if (hits >= 20) {
        message = '🏆 Sharpshooter! Excellent accuracy!';
      } else if (hits >= 15) {
        message = '👍 Great aim! Very good accuracy.';
      } else if (hits >= 10) {
        message = '📚 Good effort! Keep practicing.';
      } else {
        message = '🎯 Keep working on your accuracy!';
      }
      document.getElementById('resultMessage').textContent = message;
    }

    function resetGame() {
      document.getElementById('gameContainer').style.display = 'flex';
      document.getElementById('resultsScreen').style.display = 'none';
      document.getElementById('startBtn').disabled = false;
      document.getElementById('timeLeft').textContent = '30';
      document.getElementById('hitCount').textContent = '0';
      createTargets();
    }

    createTargets();
  </script>
</body>
</html>
