<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic 8-Ball — Troop 242</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --g: #1B4332; --gm: #2D6A4F; --gl: #52B788; --gp: #D8F3DC;
      --gold: #C8960C; --goldp: #FEF9C3; --bluep: #EFF6FF; --blue: #1E40AF;
      --bg: #F7F8F5; --w: #fff; --bd: #E2E8F0; --t: #111827; --mu: #6B7280;
      --r: 14px; --sh: 0 2px 8px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--t);
      min-height: 100vh;
      padding: 20px;
    }
    header {
      background: var(--g);
      color: #fff;
      padding: 40px 24px;
      text-align: center;
      border-radius: 16px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 30%, rgba(82, 183, 136, .2) 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 70%, rgba(212, 160, 23, .15) 0%, transparent 50%);
      pointer-events: none;
    }
    h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }
    .sub {
      color: rgba(255, 255, 255, .7);
      font-size: 15px;
      position: relative;
      z-index: 1;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: .15s;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, .25);
      gap: 8px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Eight Ball */
    .eight-ball-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      margin-bottom: 60px;
    }

    .eight-ball {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 30% 30%, #2a2a2a, #000);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, .4),
        inset -10px -10px 30px rgba(0, 0, 0, .3),
        inset 5px 5px 15px rgba(255, 255, 255, .1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: transform .3s ease;
    }

    .eight-ball:hover {
      transform: scale(1.02);
    }

    .eight-ball.shaking {
      animation: shake 2s ease-in-out forwards;
    }

    .eight-ball.positive {
      box-shadow:
        0 20px 60px rgba(82, 183, 136, .3),
        inset -10px -10px 30px rgba(0, 0, 0, .3),
        inset 5px 5px 15px rgba(82, 183, 136, .2);
    }

    .eight-ball.noncommittal {
      box-shadow:
        0 20px 60px rgba(200, 150, 12, .3),
        inset -10px -10px 30px rgba(0, 0, 0, .3),
        inset 5px 5px 15px rgba(200, 150, 12, .2);
    }

    .eight-ball.negative {
      box-shadow:
        0 20px 60px rgba(239, 68, 68, .3),
        inset -10px -10px 30px rgba(0, 0, 0, .3),
        inset 5px 5px 15px rgba(239, 68, 68, .2);
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      10% { transform: rotate(-5deg); }
      20% { transform: rotate(5deg); }
      30% { transform: rotate(-5deg); }
      40% { transform: rotate(5deg); }
      50% { transform: rotate(-3deg); }
      60% { transform: rotate(3deg); }
      70% { transform: rotate(-2deg); }
      80% { transform: rotate(2deg); }
      90% { transform: rotate(-1deg); }
      100% { transform: rotate(0deg); }
    }

    /* Ball window */
    .ball-inner {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 35% 35%, #1a1a1a, #000);
      border: 3px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, .6);
    }

    .ball-text {
      font-size: 3.5rem;
      color: #fff;
      text-align: center;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
    }

    .ball-answer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
      line-height: 1.3;
      animation: fadeIn 0.6s ease-in 0.3s forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Input Section */
    .input-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--bd);
      border-radius: 10px;
      font-size: 1rem;
      font-family: 'Outfit', sans-serif;
      background: var(--w);
      color: var(--t);
      transition: all .3s ease;
    }

    .question-input:focus {
      outline: none;
      border-color: var(--gm);
      box-shadow: 0 0 0 3px rgba(27, 67, 50, .1);
    }

    .question-input::placeholder {
      color: var(--mu);
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      transition: all .2s ease;
      letter-spacing: .3px;
    }

    .btn-primary {
      background: var(--gm);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--g);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(27, 67, 50, .2);
    }

    .btn-outline {
      background: transparent;
      color: var(--gm);
      border: 2px solid var(--gm);
    }

    .btn-outline:hover {
      background: var(--gp);
    }

    .status-text {
      text-align: center;
      font-size: 1.1rem;
      color: var(--mu);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Answer Display */
    .answer-display {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--mu);
    }

    .asked-question {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--t);
      padding: 14px;
      background: var(--gp);
      border-radius: 8px;
      border-left: 4px solid var(--gm);
      line-height: 1.5;
    }

    .answer-box {
      padding: 28px 20px;
      border-radius: 10px;
      text-align: center;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .answer-box.positive {
      background: rgba(82, 183, 136, .15);
      border: 2px solid var(--gl);
    }

    .answer-box.noncommittal {
      background: rgba(200, 150, 12, .15);
      border: 2px solid var(--gold);
    }

    .answer-box.negative {
      background: rgba(239, 68, 68, .15);
      border: 2px solid #ef4444;
    }

    .answer-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--t);
      line-height: 1.4;
    }

    /* Stats Section */
    .stats-section {
      background: var(--w);
      border: 1px solid var(--bd);
      border-radius: var(--r);
      padding: 32px;
      margin-bottom: 40px;
      box-shadow: var(--sh);
    }

    .stats-section h2 {
      margin-bottom: 24px;
      font-size: 1.3rem;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--gp);
      border-radius: 10px;
      padding: 18px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gm);
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--g);
    }

    /* History */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      background: var(--bg);
      border-left: 4px solid #ccc;
      font-size: 0.9rem;
    }

    .history-item.positive { border-left-color: var(--gl); }
    .history-item.noncommittal { border-left-color: var(--gold); }
    .history-item.negative { border-left-color: #ef4444; }

    .history-q {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .history-num {
      flex-shrink: 0;
      font-weight: 700;
      color: var(--mu);
      font-size: 0.8rem;
      min-width: 24px;
    }

    .history-question {
      color: var(--t);
      line-height: 1.3;
    }

    .history-a {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      color: #fff;
    }

    .history-a.positive { background: var(--gl); }
    .history-a.noncommittal { background: var(--gold); color: #333; }
    .history-a.negative { background: #ef4444; }

    .clear-btn {
      width: 100%;
      margin-top: 16px;
    }

    /* Responsive */
    @media (max-width: 640px) {
      header {
        padding: 32px 20px;
        margin-bottom: 32px;
      }

      .eight-ball-wrapper {
        gap: 32px;
        margin-bottom: 40px;
      }

      .eight-ball {
        width: 220px;
        height: 220px;
      }

      .ball-inner {
        width: 110px;
        height: 110px;
      }

      .ball-text {
        font-size: 2.5rem;
      }

      .stats-row {
        grid-template-columns: repeat(2, 1fr);
      }

      .history-item {
        grid-template-columns: 1fr;
      }

      .stats-section {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="scout-games-hub.html" class="back-btn">← Back</a>
    <h1>🎱 Magic 8-Ball</h1>
    <p class="sub">Ask the magic 8-ball any yes-or-no question and let fate decide</p>
  </header>

  <div class="container">
    <div class="eight-ball-wrapper">
      <div id="ball" class="eight-ball">
        <div class="ball-inner">
          <div id="ballText" class="ball-text">🎱</div>
        </div>
      </div>

      <div class="input-section">
        <input
          type="text"
          id="questionInput"
          class="question-input"
          placeholder="Ask me a yes or no question..."
          onkeypress="handleKeyPress(event)"
        />
        <button class="btn btn-primary" onclick="askQuestion()">Ask the Ball</button>
        <div id="statusText" class="status-text" style="display: none;">🌀 The ball is thinking...</div>
        <div id="answerDisplay" class="answer-display" style="display: none;">
          <p class="question-label">You asked:</p>
          <p id="askedQuestion" class="asked-question"></p>
          <div id="answerBox" class="answer-box">
            <p id="answerText" class="answer-text"></p>
          </div>
          <button class="btn btn-primary" onclick="reset()">Ask Another Question</button>
        </div>
      </div>
    </div>

    <div id="statsSection" class="stats-section" style="display: none;">
      <h2>📊 Question History</h2>
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-label">Total</span>
          <span id="totalQuestions" class="stat-number">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Positive</span>
          <span id="positiveCount" class="stat-number">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Uncertain</span>
          <span id="uncertainCount" class="stat-number">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Negative</span>
          <span id="negativeCount" class="stat-number">0</span>
        </div>
      </div>

      <div id="historyList" class="history-list"></div>
      <button class="btn btn-outline clear-btn" onclick="clearHistory()">Clear History</button>
    </div>
  </div>

  <script>
    const ANSWERS = {
      positive: [
        'It is certain',
        'It is decidedly so',
        'Without a doubt',
        'Yes definitely',
        'You may rely on it',
        'As I see it, yes',
        'Most likely',
        'Outlook good',
        'Yes',
        'Signs point to yes'
      ],
      noncommittal: [
        'Reply hazy, try again',
        'Ask again later',
        'Better not tell you now',
        'Cannot predict now',
        'Concentrate and ask again'
      ],
      negative: [
        "Don't count on it",
        'My reply is no',
        'My sources say no',
        'Outlook not so good',
        'Very doubtful'
      ]
    };

    let state = {
      phase: 'intro',
      currentAnswer: '',
      answerType: '',
      question: '',
      total: 0,
      history: []
    };

    function getRandomAnswer() {
      const allAnswers = [...ANSWERS.positive, ...ANSWERS.noncommittal, ...ANSWERS.negative];
      const types = ['positive', 'noncommittal', 'negative'];
      const type = types[Math.floor(Math.random() * types.length)];
      const answer = ANSWERS[type][Math.floor(Math.random() * ANSWERS[type].length)];
      return { answer, type };
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && state.phase === 'intro') {
        askQuestion();
      }
    }

    function askQuestion() {
      const input = document.getElementById('questionInput');
      const question = input.value.trim();

      if (!question) {
        alert('Please ask a question!');
        return;
      }

      state.question = question;
      state.phase = 'shaking';

      // Show shaking state
      const ball = document.getElementById('ball');
      const ballText = document.getElementById('ballText');
      const statusText = document.getElementById('statusText');
      const answerDisplay = document.getElementById('answerDisplay');

      input.style.display = 'none';
      document.querySelector('.btn-primary').style.display = 'none';
      statusText.style.display = 'block';

      ball.classList.add('shaking');

      // Simulate shaking duration
      setTimeout(() => {
        const { answer, type } = getRandomAnswer();
        state.currentAnswer = answer;
        state.answerType = type;
        state.phase = 'answer';
        state.total++;

        state.history.push({
          question,
          answer,
          type
        });

        // Update ball appearance
        ball.classList.remove('shaking');
        ball.classList.add(type);

        // Show answer
        ballText.innerHTML = '';
        const answerDiv = document.createElement('div');
        answerDiv.className = `ball-answer ${type}`;
        answerDiv.innerHTML = `<span>${answer}</span>`;
        ballText.appendChild(answerDiv);

        // Show answer display
        statusText.style.display = 'none';
        document.getElementById('askedQuestion').textContent = `"${question}"`;
        document.getElementById('answerBox').className = `answer-box ${type}`;
        document.getElementById('answerText').textContent = answer;
        answerDisplay.style.display = 'flex';

        // Update stats
        updateStats();
      }, 2000);
    }

    function reset() {
      state.phase = 'intro';

      const input = document.getElementById('questionInput');
      const ball = document.getElementById('ball');
      const ballText = document.getElementById('ballText');
      const answerDisplay = document.getElementById('answerDisplay');

      input.value = '';
      input.style.display = 'block';
      document.querySelector('.btn-primary').style.display = 'block';
      answerDisplay.style.display = 'none';

      ball.classList.remove('positive', 'noncommittal', 'negative');
      ballText.innerHTML = '<div class="ball-text">🎱</div>';

      input.focus();
    }

    function updateStats() {
      const stats = document.getElementById('statsSection');
      stats.style.display = 'block';

      document.getElementById('totalQuestions').textContent = state.total;
      document.getElementById('positiveCount').textContent = state.history.filter(h => h.type === 'positive').length;
      document.getElementById('uncertainCount').textContent = state.history.filter(h => h.type === 'noncommittal').length;
      document.getElementById('negativeCount').textContent = state.history.filter(h => h.type === 'negative').length;

      // Update history list
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = state.history.map((entry, idx) => `
        <div class="history-item ${entry.type}">
          <div class="history-q">
            <span class="history-num">Q${idx + 1}</span>
            <span class="history-question">${entry.question}</span>
          </div>
          <div class="history-a ${entry.type}">${entry.answer}</div>
        </div>
      `).join('');
    }

    function clearHistory() {
      state.history = [];
      state.total = 0;
      document.getElementById('statsSection').style.display = 'none';
      reset();
    }

    // Auto-focus input
    window.addEventListener('load', () => {
      document.getElementById('questionInput').focus();
    });
  </script>
</body>
</html>
