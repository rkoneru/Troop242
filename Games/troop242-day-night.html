<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Troop 242 — Day & Night Sky</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { width:100vw; height:100vh; overflow:hidden; font-family:'Raleway',sans-serif; }

  /* ── SKY ── */
  .sky { position:absolute; inset:0; }

  /* ── STARS ── */
  #stars { position:absolute; inset:0; pointer-events:none; }
  .star {
    position:absolute; border-radius:50%; background:#fff;
    animation: twinkle 2s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity:0.15; transform:scale(0.8); }
    to   { opacity:1;    transform:scale(1.3); }
  }

  /* ── SUN RAYS ── */
  .ray {
    position:absolute; left:50%; top:50%;
    width:2px; border-radius:2px;
    transform-origin:50% 0%;
    background:rgba(255,235,100,0.5);
    animation:rayPulse 2.2s ease-in-out infinite alternate;
  }
  @keyframes rayPulse {
    from { opacity:0.25; }
    to   { opacity:0.75; }
  }

  /* ── CLOUDS ── */
  #clouds { position:absolute; inset:0; pointer-events:none; }
  .cloud {
    position:absolute; border-radius:60px;
    background:rgba(255,255,255,0.88);
    filter:blur(3px);
  }
  .cloud::before, .cloud::after {
    content:''; position:absolute;
    background:rgba(255,255,255,0.92); border-radius:50%;
  }

  /* ── AURORA ── */
  #aurora {
    position:absolute; width:140%; height:45%; top:0; left:-20%;
    background:linear-gradient(180deg,
      transparent 0%, rgba(0,210,120,0.09) 35%,
      rgba(80,0,210,0.07) 65%, transparent 100%);
    filter:blur(28px); pointer-events:none;
    animation:auroraWave 9s ease-in-out infinite;
  }
  @keyframes auroraWave {
    0%  { transform:skewX(-6deg) translateX(0);   }
    50% { transform:skewX(6deg)  translateX(40px); }
    100%{ transform:skewX(-6deg) translateX(0);   }
  }

  /* ── FOREST ── */
  #forest {
    position:absolute; bottom:0; left:0; right:0;
    height:32%; pointer-events:none; z-index:5;
  }
  #forest svg { width:100%; height:100%; display:block; }

  /* ── FIREFLIES ── */
  .firefly {
    position:absolute; width:4px; height:4px;
    border-radius:50%; background:#c8ff00;
    box-shadow:0 0 6px 3px rgba(200,255,0,0.8);
    pointer-events:none; z-index:6;
    animation:ffFloat linear infinite;
  }
  @keyframes ffFloat {
    0%  { transform:translate(0,0);      }
    25% { transform:translate(6px,-8px); }
    50% { transform:translate(-4px,-14px);}
    75% { transform:translate(8px,-6px); }
    100%{ transform:translate(0,0);      }
  }

  /* ── BRANDING ── */
  #branding {
    position:absolute; top:48%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center; z-index:10; pointer-events:none;
  }
  .fleur { font-size:clamp(2rem,6vw,4rem); display:block; margin-bottom:0.1em; }
  .scout-label {
    font-family:'Raleway',sans-serif;
    font-size:clamp(0.75rem,2vw,1.2rem);
    font-weight:300; letter-spacing:0.55em; text-transform:uppercase;
  }
  .troop-num {
    font-family:'Cinzel',serif;
    font-size:clamp(4rem,13vw,9rem);
    font-weight:900; letter-spacing:0.04em; line-height:1;
  }
  .location-label {
    font-family:'Raleway',sans-serif;
    font-size:clamp(0.65rem,1.5vw,0.95rem);
    font-weight:300; letter-spacing:0.4em; text-transform:uppercase;
    margin-top:0.6em; opacity:0.8;
  }

  /* ── TIME BADGE ── */
  #time-badge {
    position:absolute; bottom:16%; left:50%;
    transform:translateX(-50%);
    font-family:'Raleway',sans-serif;
    font-size:0.72rem; letter-spacing:0.35em; text-transform:uppercase;
    color:rgba(255,255,255,0.55); z-index:10; pointer-events:none;
  }

  /* ── CONTROLS ── */
  #controls {
    position:absolute; bottom:1.4rem; right:1.4rem;
    z-index:20; display:flex; gap:0.5rem;
  }
  .ctrl {
    background:rgba(255,255,255,0.13);
    border:1px solid rgba(255,255,255,0.28);
    color:#fff; font-family:'Raleway',sans-serif;
    font-size:0.72rem; letter-spacing:0.12em;
    padding:0.38rem 0.8rem; border-radius:4px;
    cursor:pointer; backdrop-filter:blur(6px); transition:background 0.2s;
  }
  .ctrl:hover  { background:rgba(255,255,255,0.22); }
  .ctrl.active { background:rgba(255,255,255,0.32); border-color:rgba(255,255,255,0.65); }

  /* ── MUSIC TOGGLE ── */
  #music-toggle {
    position:absolute; top:1.4rem; right:1.4rem;
    z-index:20;
    background:rgba(255,255,255,0.13);
    border:1px solid rgba(255,255,255,0.28);
    color:#fff; font-family:'Raleway',sans-serif;
    font-size:0.72rem; letter-spacing:0.12em;
    padding:0.38rem 0.8rem; border-radius:4px;
    cursor:pointer; backdrop-filter:blur(6px);
    transition:background 0.2s;
  }
  #music-toggle:hover { background:rgba(255,255,255,0.22); }
  #music-toggle.active { background:rgba(255,255,255,0.32); border-color:rgba(255,255,255,0.65); }

  /* ── AUDIO PANEL ── */
  #audio-panel {
    position:absolute; top:1.4rem; right:7rem;
    z-index:20;
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.28);
    padding:1rem; border-radius:8px;
    backdrop-filter:blur(10px);
    display:none; flex-direction:column;
    gap:0.8rem;
    min-width:180px;
  }
  #audio-panel.show { display:flex; }
  .audio-label {
    color:#fff; font-family:'Raleway',sans-serif;
    font-size:0.65rem; letter-spacing:0.1em;
    text-transform:uppercase; margin-bottom:0.3rem;
  }
  .volume-slider {
    width:100%; height:4px; border-radius:2px;
    background:rgba(255,255,255,0.2);
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance:none;
    appearance:none;
    width:14px; height:14px;
    border-radius:50%;
    background:rgba(255,255,255,0.8);
    cursor:pointer;
    border:2px solid rgba(255,255,255,0.3);
  }
  .volume-slider::-moz-range-thumb {
    width:14px; height:14px;
    border-radius:50%;
    background:rgba(255,255,255,0.8);
    cursor:pointer;
    border:2px solid rgba(255,255,255,0.3);
  }
  .sound-btn {
    background:rgba(255,255,255,0.13);
    border:1px solid rgba(255,255,255,0.28);
    color:#fff; font-family:'Raleway',sans-serif;
    font-size:0.7rem; letter-spacing:0.08em;
    padding:0.4rem 0.6rem; border-radius:4px;
    cursor:pointer; transition:background 0.2s;
    width:100%;
  }
  .sound-btn:hover { background:rgba(255,255,255,0.22); }

  /* ── HOME BUTTON ── */
  #home-button-container {
    position:absolute; bottom:1.4rem; left:1.4rem;
    z-index:20;
  }
  .home-btn {
    background:rgba(255,255,255,0.13);
    border:1px solid rgba(255,255,255,0.28);
    color:#fff; font-family:'Raleway',sans-serif;
    font-size:0.72rem; letter-spacing:0.12em;
    padding:0.38rem 0.8rem; border-radius:4px;
    cursor:pointer; backdrop-filter:blur(6px);
    transition:background 0.2s;
    display:inline-block;
    text-decoration:none;
  }
  .home-btn:hover  { background:rgba(255,255,255,0.22); }

  /* ── CLOCK ── */
  #clock-display {
    position:absolute; bottom:1.4rem; left:50%;
    transform:translateX(-50%);
    z-index:20;
    background:rgba(255,255,255,0.13);
    border:1px solid rgba(255,255,255,0.28);
    color:#fff; font-family:'Raleway',sans-serif;
    font-size:0.72rem; letter-spacing:0.12em;
    padding:0.38rem 0.8rem; border-radius:4px;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
  }

  /* ── TENTS ── */
  #tents { position:absolute; bottom:0; left:0; right:0; height:100%; pointer-events:none; z-index:6; }

  /* ── CAMPFIRE ── */
  #campfire-container { position:absolute; bottom:8%; left:50%; transform:translateX(-50%); z-index:7; pointer-events:none; width:80px; height:100px; }

  .flame {
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    border-radius:50% 50% 30% 30%;
    animation: flicker linear infinite alternate;
  }
  .flame-outer { width:60px; height:70px; background:rgba(255,100,0,0.8); animation-duration:0.4s; }
  .flame-mid { width:40px; height:50px; background:rgba(255,180,0,0.9); animation-duration:0.3s; animation-delay:0.05s; }
  .flame-inner { width:20px; height:30px; background:rgba(255,255,80,1); animation-duration:0.25s; animation-delay:0.1s; }

  @keyframes flicker {
    0%   { transform:translateX(-50%) scaleX(1)   scaleY(1)    rotate(-3deg); opacity:0.9; }
    50%  { transform:translateX(-50%) scaleX(0.85) scaleY(1.15) rotate(2deg); opacity:1;   }
    100% { transform:translateX(-50%) scaleX(1.1)  scaleY(0.9)  rotate(-2deg); opacity:0.85;}
  }

  .smoke {
    position:absolute; bottom:70px; left:50%;
    width:8px; height:8px; border-radius:50%;
    background:rgba(180,180,180,0.4);
    animation: smokeRise 3s ease-out forwards;
  }

  @keyframes smokeRise {
    0%   { transform:translateX(-50%) translateY(0) scale(0.3); opacity:0.6; }
    50%  { transform:translateX(-50%) translateY(-30px) scale(0.6); opacity:0.3; }
    100% { transform:translateX(-50%) translateY(-80px) scale(1); opacity:0; }
  }

  /* ── SCOUT ACTIVITY BADGE ── */
  #scout-activity {
    position:absolute; top:1.4rem; left:1.4rem;
    z-index:10;
    background:rgba(255,255,255,0.13);
    border:1px solid rgba(255,255,255,0.28);
    color:#fff; font-family:'Raleway',sans-serif;
    font-size:0.72rem; letter-spacing:0.12em;
    padding:0.38rem 0.8rem; border-radius:4px;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    transition:opacity 0.8s ease-in-out;
    pointer-events:none;
  }

  /* ── BIRDS LAYER ── */
  #birds-layer { position:absolute; inset:0; pointer-events:none; z-index:8; }

  .bird-group { position:absolute; display:flex; gap:8px; animation:birdFly linear infinite; }

  @keyframes birdFly {
    from { transform: translateX(-100px); }
    to   { transform: translateX(110vw); }
  }

  .bird {
    width:14px; height:7px;
    border-top:2px solid currentColor; border-radius:50% 50% 0 0;
    position:relative;
  }

  .bird::after {
    content:''; position:absolute;
    width:14px; height:7px;
    border-top:2px solid currentColor; border-radius:50% 50% 0 0;
    left:12px; top:0;
  }

  /* ── HIKERS LAYER ── */
  #hikers-layer {
    position:absolute; bottom:0; left:0; right:0;
    height:32%; pointer-events:none; z-index:9;
  }
  #hikers-svg { width:100%; height:100%; display:block; }

  @keyframes hikerBob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-2px); }
  }
  .hiker { animation: hikerBob 0.55s ease-in-out infinite; }
  /* stagger bob per scout */
  .hiker:nth-child(2) { animation-delay: 0.11s; }
  .hiker:nth-child(3) { animation-delay: 0.22s; }
  .hiker:nth-child(4) { animation-delay: 0.33s; }
  .hiker:nth-child(5) { animation-delay: 0.44s; }
</style>
</head>

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
let CYCLE_MS   = 20000;
let cycleStart = performance.now();

// Cycle fractions
const SUN_RISE  = 0.25;   // t when sun crests the left horizon
const SUN_SET   = 0.75;   // t when sun sinks below right horizon
const MOON_RISE = 0.75;   // t when moon crests the left horizon (night starts)
const MOON_SET  = 0.25;   // t when moon sinks (wraps through 1→0)

// ══════════════════════════════════════════
// DOM REFS
// ══════════════════════════════════════════
const skyEl           = document.getElementById('sky');
const sunEl           = document.getElementById('sun');
const sunRaysEl       = document.getElementById('sun-rays');
const moonEl          = document.getElementById('moon');
const moonGlowEl      = document.getElementById('moon-glow');
const starsEl         = document.getElementById('stars');
const cloudsEl        = document.getElementById('clouds');
const auroraEl        = document.getElementById('aurora');
const forestEl        = document.getElementById('forest');
const hGlowEl         = document.getElementById('horizon-glow');
const ffLayer         = document.getElementById('fireflies-layer');
const tentsEl         = document.getElementById('tents');
const campfireEl      = document.getElementById('campfire-container');
const birdsLayerEl    = document.getElementById('birds-layer');
const hikersLayerEl   = document.getElementById('hikers-layer');
const scoutActivityEl = document.getElementById('scout-activity');
const brandingEl      = document.getElementById('branding');
const timeBadge       = document.getElementById('time-badge');
const musicToggle     = document.getElementById('music-toggle');

// ══════════════════════════════════════════
// AUDIO SYSTEM
// ══════════════════════════════════════════
let audioCtx = null;
let oscillators = {};
let musicEnabled = false;
let currentPhase = null;
let ambientVolume = 0.5;
let ambientGainNode = null;
let lfoNodes = {}; // Low Frequency Oscillators for modulation
let convolver = null; // Reverb effect

const MUSIC_PHASES = {
  night: {
    color: '🌙',
    name: 'Deep Night',
    layers: [
      { freq: 32, type: 'sine', gain: 0.06, lfo: 0.05, note: 'subsonic meditation base' },

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function getMusicPhase(t) {
  if (t < 0.18) return 'night';
  if (t < 0.28) return 'dawn';
  if (t < 0.50) return 'morning';
  if (t < 0.70) return 'day';
  if (t < 0.80) return 'evening';
  return 'night_late';
}

function updateMusic(t) {
  if (!musicEnabled || !audioCtx) return;

  const phase = getMusicPhase(t);

  if (phase !== currentPhase) {
    currentPhase = phase;
    const config = MUSIC_PHASES[phase];

    // Stop old oscillators
    Object.values(oscillators).forEach(osc => {
      try { osc.stop(); } catch(e) {}
    });
    Object.values(lfoNodes).forEach(lfo => {
      try { lfo.stop(); } catch(e) {}
    });
    oscillators = {};
    lfoNodes = {};

    // Create master ambient gain node with reverb
    if (!ambientGainNode) {
      ambientGainNode = audioCtx.createGain();

      // Create simple reverb using delay network
      const dryGain = audioCtx.createGain();
      const wetGain = audioCtx.createGain();
      const delay1 = audioCtx.createDelay(1);
      const delay2 = audioCtx.createDelay(1);
      const delay3 = audioCtx.createDelay(1);
      const feedback = audioCtx.createGain();

      dryGain.gain.value = 0.7;
      wetGain.gain.value = 0.3;
      delay1.delayTime.value = 0.037;
      delay2.delayTime.value = 0.041;
      delay3.delayTime.value = 0.043;
      feedback.gain.value = 0.3;

      ambientGainNode.connect(dryGain);
      dryGain.connect(audioCtx.destination);

      ambientGainNode.connect(delay1);
      delay1.connect(delay2);
      delay2.connect(delay3);
      delay3.connect(feedback);
      feedback.connect(delay1);
      delay3.connect(wetGain);
      wetGain.connect(audioCtx.destination);
    }

    // Create layered ambient sound with LFO modulation
    config.layers.forEach((layer, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.frequency.value = layer.freq;
      osc.type = layer.type;
      gain.gain.value = layer.gain;
      filter.type = 'lowpass';
      filter.frequency.value = 2000 - idx * 200;
      filter.Q.value = 0.3;

      // LFO (Low Frequency Oscillator) for smooth modulation
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.value = layer.lfo || 0.5; // Very slow modulation (0.5-0.1 Hz)
      lfoGain.gain.value = 2 + Math.random(); // Subtle variation

      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency); // Modulate the oscillator frequency

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ambientGainNode);

      ambientGainNode.gain.value = ambientVolume;

      osc.start();
      lfo.start();

      oscillators[`layer-${idx}`] = osc;
      lfoNodes[`lfo-${idx}`] = lfo;
    });

    // Update button with current phase
    musicToggle.textContent = `${config.color} Music`;
  }
}

function playBirds() {
  if (!audioCtx) initAudio();

  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const freq = 2000 + Math.random() * 2000;

      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }, i * 200);
  }
}

function playCrickets() {
  if (!audioCtx) initAudio();

  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const freq = 3000 + Math.random() * 1500;

      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }, i * 100);
  }
}

function toggleMusic() {
  musicEnabled = !musicEnabled;
  if (musicEnabled) {
    initAudio();
    musicToggle.classList.add('active');
    document.getElementById('audio-panel').classList.add('show');

    Object.values(oscillators).forEach(osc => {
      try { osc.stop(); } catch(e) {}
    });
    oscillators = {};
    currentPhase = null;
    musicToggle.classList.remove('active');
    document.getElementById('audio-panel').classList.remove('show');
  }
}

// ══════════════════════════════════════════
// MATH HELPERS
// ══════════════════════════════════════════
const lerp        = (a,b,t) => a+(b-a)*t;
const clamp       = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const smoothstep  = (e0,e1,x) => { const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const lerpC       = (c1,c2,t) => c1.map((v,i) => Math.round(lerp(v,c2[i],t)));
const rgb         = c => `rgb(${c[0]},${c[1]},${c[2]})`;

// ══════════════════════════════════════════
// SKY PALETTE  [t, topRGB, midRGB, botRGB]
// ══════════════════════════════════════════
const SKY = [
  [0.00, [6,6,38],    [18,18,68],   [36,22,68]  ],
  [0.18, [14,6,48],   [48,20,85],   [80,30,95]  ],
  [0.24, [36,12,66],  [100,44,115], [165,68,105]],
  [0.28, [255,88,48], [255,158,35], [255,205,28]],
  [0.36, [82,162,235],[132,195,248],[255,215,115]],
  [0.50, [15,85,185], [55,148,235], [170,220,250]],
  [0.65, [15,85,185], [55,148,235], [170,220,250]],
  [0.70, [82,162,235],[132,195,248],[255,215,115]],
  [0.74, [255,88,48], [255,158,35], [255,205,28]],
  [0.80, [36,12,66],  [100,44,115], [165,68,105]],
  [0.90, [6,6,38],    [18,18,68],   [36,22,68]  ],
  [1.00, [6,6,38],    [18,18,68],   [36,22,68]  ],
];

function getSkyColors(t) {
  let lo = SKY[0], hi = SKY[SKY.length-1];
  for (let i = 0; i < SKY.length-1; i++) {
    if (t >= SKY[i][0] && t <= SKY[i+1][0]) { lo = SKY[i]; hi = SKY[i+1]; break; }
  }
  const f = lo[0] === hi[0] ? 0 : (t-lo[0])/(hi[0]-lo[0]);
  return [lerpC(lo[1],hi[1],f), lerpC(lo[2],hi[2],f), lerpC(lo[3],hi[3],f)];
}

// ══════════════════════════════════════════
// CELESTIAL ARC
//   progress 0→1 maps to left-horizon → zenith → right-horizon
//   Arc is a semicircle; centre at bottom-centre of sky area
// ══════════════════════════════════════════
function arcPos(progress) {
  const W = window.innerWidth, H = window.innerHeight;
  const cy  = H * 0.70;       // horizon Y
  const R   = W * 0.52;       // arc radius
  const ang = progress * Math.PI;          // 0 → π
  return {
    x: W * 0.5 - R * Math.cos(ang),       // starts left, ends right
    y: cy       - R * Math.sin(ang),       // peaks high at ang=π/2
  };
}

// ══════════════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════════════
let lastLbl = '', frameIdx = 0;

function tick(now) {
  const t = ((now - cycleStart) % CYCLE_MS) / CYCLE_MS;
  const W = window.innerWidth, H = window.innerHeight;
  const horizY = H * 0.70;

  // ── Update Music ──
  updateMusic(t);

  // ── Sky ──
  const [tc,mc,bc] = getSkyColors(t);
  skyEl.style.background =
    `linear-gradient(180deg,${rgb(tc)} 0%,${rgb(mc)} 45%,${rgb(bc)} 100%)`;

  // ──────────────────────────────────────
  // SUN  (visible t=0.25→0.75)
  // ──────────────────────────────────────
  const sunIn  = t >= SUN_RISE && t <= SUN_SET;
  const sunProg = sunIn ? (t - SUN_RISE) / (SUN_SET - SUN_RISE) : -1;

  if (sunProg >= 0) {
    const { x: sx, y: sy } = arcPos(sunProg);
    const high = Math.sin(sunProg * Math.PI);              // 0 at horizon, 1 at zenith
    const below = sy > horizY + 28;

    // Sun colour: warm orange at horizon, bright yellow-white at zenith
    const r1 = 255, g1 = Math.round(lerp(240,252,high)), b1 = Math.round(lerp(160,220,high));
    const r2 = 255, g2 = Math.round(lerp(130,230,high)), b2 = Math.round(lerp(0,40,high));
    const r3 = Math.round(lerp(195,255,high)), g3 = Math.round(lerp(70,150,high)), b3 = 0;
    const glow1Size = Math.round(lerp(24,50,high)), glow1Blur = Math.round(lerp(28,52,high));
    const glow2Size = Math.round(lerp(15,38,high)), glow2Blur = Math.round(lerp(55,110,high));
    const glowAlpha1 = lerp(0.45,0.72,high).toFixed(2);
    const glowAlpha2 = lerp(0.18,0.32,high).toFixed(2);

    sunEl.style.cssText = `
      position:absolute; width:68px; height:68px; border-radius:50%;
      pointer-events:none; z-index:4; transform:translate(-50%,-50%);
      left:${sx.toFixed(1)}px; top:${sy.toFixed(1)}px;
      background:radial-gradient(circle at 42% 38%,
        rgb(${r1},${g1},${b1}) 0%,
        rgb(${r2},${g2},${b2}) 48%,
        rgb(${r3},${g3},${b3}) 100%);
      box-shadow:
        0 0 ${glow1Blur}px ${glow1Size}px rgba(255,${g2},0,${glowAlpha1}),
        0 0 ${glow2Blur}px ${glow2Size}px rgba(255,${Math.round(g2*0.7)},0,${glowAlpha2});
      opacity:${below ? 0 : 1};
    `;

    // Rays — rotate slowly, fade at horizon
    const rayOpacity = (below ? 0 : high * 0.82).toFixed(3);
    const rayRot = (now * 0.008) % 360;
    sunRaysEl.style.cssText = `
      position:absolute; left:${sx.toFixed(1)}px; top:${sy.toFixed(1)}px;
      width:0; height:0; transform:translate(-50%,-50%) rotate(${rayRot.toFixed(1)}deg);
      z-index:3; pointer-events:none; opacity:${rayOpacity};
    `;

    // Horizon glow at sunrise/sunset
    const hPeak = 1 - clamp(Math.abs(sunProg - 0.0)*6, 0, 1) *
                      clamp(Math.abs(sunProg - 1.0)*6, 0, 1);
    // sharper at edges (sunProg near 0 or 1)
    const edgeness = Math.max(
      smoothstep(0.08, 0, sunProg),
      smoothstep(0.92, 1, sunProg)
    );
    const gr = Math.round(lerp(255, 255, edgeness));
    const gg = Math.round(lerp(100, 60, edgeness));
    const gb = Math.round(lerp(30, 10, edgeness));
    hGlowEl.style.cssText = `
      position:absolute; left:0; right:0;
      bottom:${((1 - horizY/H)*100).toFixed(1)}%;
      height:90px; filter:blur(14px); z-index:2; pointer-events:none;
      background:radial-gradient(ellipse at 50% 100%,rgba(${gr},${gg},${gb},0.75) 0%,transparent 70%);
      opacity:${edgeness.toFixed(3)};
    `;
  } else {
    sunEl.style.opacity  = '0';
    sunRaysEl.style.opacity = '0';
    hGlowEl.style.opacity = '0';
  }

  // ──────────────────────────────────────
  // MOON  (visible t=0.75→1.0→0.25)
  //  moonProgress: 0=moonrise, 0.5=zenith(midnight), 1=moonset
  // ──────────────────────────────────────
  const nightDur = 1 - (SUN_SET - SUN_RISE);  // = 0.5
  let moonProg = -1;
  if (t >= MOON_RISE) {
    moonProg = (t - MOON_RISE) / nightDur;
  } else if (t <= MOON_SET) {
    moonProg = (1 - MOON_RISE + t) / nightDur;
  }

  if (moonProg >= 0 && moonProg <= 1) {
    const { x: mx, y: my } = arcPos(moonProg);
    const moonHigh = Math.sin(moonProg * Math.PI);
    const below = my > horizY + 22;
    const vis = below ? 0 : 1;
    const glowR = Math.round(lerp(65, 95, moonHigh));

    moonEl.style.left = `${mx.toFixed(1)}px`;
    moonEl.style.top  = `${my.toFixed(1)}px`;
    moonEl.style.opacity = vis;

    // shadow mask on moon to suggest crescent phase (subtle)
    const phase = moonProg; // 0=new(rising), 0.5=full, 1=new(setting)
    const crescentOffset = Math.round(lerp(-14, 14, moonProg));

    moonEl.style.boxShadow = `
      0 0 26px 7px rgba(180,180,255,0.32),
      0 0 55px 18px rgba(140,140,220,0.16),
      inset ${crescentOffset}px -4px 0 4px rgba(30,30,70,${lerp(0.35,0,moonHigh).toFixed(2)})
    `;

    moonGlowEl.style.cssText = `
      position:absolute; border-radius:50%;
      width:${glowR}px; height:${glowR}px;
      left:${mx.toFixed(1)}px; top:${my.toFixed(1)}px;
      transform:translate(-50%,-50%); z-index:3; pointer-events:none;
      background:radial-gradient(circle, rgba(180,190,255,0.18) 0%, transparent 70%);
      opacity:${vis};
    `;
  } else {
    moonEl.style.opacity      = '0';
    moonGlowEl.style.opacity  = '0';
  }

  // ──────────────────────────────────────
  // STARS
  // ──────────────────────────────────────
  let starOp;
  if      (t < 0.20) starOp = 1;
  else if (t < 0.32) starOp = lerp(1, 0, smoothstep(0.20, 0.32, t));
  else if (t < 0.70) starOp = 0;
  else if (t < 0.82) starOp = lerp(0, 1, smoothstep(0.70, 0.82, t));
  else               starOp = 1;
  starsEl.style.opacity = starOp.toFixed(3);

  // ──────────────────────────────────────
  // CLOUDS
  // ──────────────────────────────────────
  let cloudOp;
  if      (t < 0.30) cloudOp = 0;
  else if (t < 0.40) cloudOp = smoothstep(0.30, 0.40, t);
  else if (t < 0.68) cloudOp = 1;
  else if (t < 0.78) cloudOp = lerp(1, 0, smoothstep(0.68, 0.78, t));
  else               cloudOp = 0;
  cloudsEl.style.opacity = cloudOp.toFixed(3);

  // ──────────────────────────────────────
  // AURORA
  // ──────────────────────────────────────
  let auroraOp;
  if      (t < 0.08) auroraOp = 0.85;
  else if (t < 0.24) auroraOp = lerp(0.85, 0, smoothstep(0.08, 0.24, t));
  else if (t < 0.80) auroraOp = 0;
  else if (t < 0.94) auroraOp = lerp(0,  0.85, smoothstep(0.80, 0.94, t));
  else               auroraOp = 0.85;
  auroraEl.style.opacity = auroraOp.toFixed(3);

  // ──────────────────────────────────────
  // FOREST BRIGHTNESS
  // ──────────────────────────────────────
  let fb;
  if      (t < 0.24) fb = 0.12;
  else if (t < 0.38) fb = lerp(0.12, 0.78, smoothstep(0.24, 0.38, t));
  else if (t < 0.65) fb = lerp(0.78, 0.92, smoothstep(0.38, 0.65, t));
  else if (t < 0.75) fb = lerp(0.92, 0.48, smoothstep(0.65, 0.75, t));
  else if (t < 0.86) fb = lerp(0.48, 0.12, smoothstep(0.75, 0.86, t));
  else               fb = 0.12;
  forestEl.style.filter = `brightness(${fb.toFixed(3)})`;

  // ──────────────────────────────────────
  // FIREFLIES — flicker at night
  // ──────────────────────────────────────
  let ffBase;
  if      (t < 0.20) ffBase = 1;
  else if (t < 0.32) ffBase = lerp(1, 0, smoothstep(0.20, 0.32, t));
  else if (t < 0.72) ffBase = 0;
  else if (t < 0.82) ffBase = lerp(0, 1, smoothstep(0.72, 0.82, t));
  else               ffBase = 1;

  fireflies.forEach((ff, i) => {
    const flicker = ffBase > 0.05
      ? clamp(Math.sin(now * 0.0028 + i * 1.9) * 0.35 + 0.72, 0, 1)
      : 0;
    ff.style.opacity = (ffBase * flicker).toFixed(3);
  });

  // ──────────────────────────────────────
  // BRANDING COLOUR
  // ──────────────────────────────────────
  let bc2, bs;
  if      (t < 0.28 || t > 0.82) { bc2='rgba(255,255,255,0.96)'; bs='0 0 30px rgba(160,160,255,0.6)'; }
  else if (t < 0.38)              { bc2='rgba(255,218,128,0.95)'; bs='0 0 38px rgba(255,155,0,0.55)'; }
  else if (t < 0.68)              { bc2='rgba(255,255,255,1)';    bs='0 2px 20px rgba(0,45,155,0.42)';}
  else                            { bc2='rgba(255,205,118,0.95)'; bs='0 0 38px rgba(255,95,0,0.5)';   }
  brandingEl.style.color      = bc2;
  brandingEl.style.textShadow = bs;

  // ──────────────────────────────────────
  // TENTS BRIGHTNESS
  // ──────────────────────────────────────
  tentsEl.style.filter = `brightness(${fb.toFixed(3)})`;

  // ──────────────────────────────────────
  // CAMPFIRE (day dim → night bright)
  // ──────────────────────────────────────
  let campfireOp;
  if      (t < 0.30) campfireOp = 1;       // full night brightness
  else if (t < 0.40) campfireOp = lerp(1, 0.05, smoothstep(0.30, 0.40, t)); // fade down morning
  else if (t < 0.72) campfireOp = 0.05;    // dim all day
  else if (t < 0.80) campfireOp = lerp(0.05, 1, smoothstep(0.72, 0.80, t)); // fade up evening
  else               campfireOp = 1;        // full night brightness

  campfireEl.style.opacity = campfireOp.toFixed(3);

  // Glow effect at night
  const campfireGlow = campfireOp > 0.8 ? `0 0 40px 15px rgba(255,100,0,${(campfireOp*0.4).toFixed(2)})` : 'none';
  const campfireBase = campfireEl.querySelector('.flame-outer');
  if (campfireBase) campfireBase.style.boxShadow = campfireGlow;

  // ──────────────────────────────────────
  // BIRDS (daytime only)
  // ──────────────────────────────────────
  let birdOp;
  if      (t < 0.30) birdOp = 0;
  else if (t < 0.40) birdOp = smoothstep(0.30, 0.40, t);
  else if (t < 0.72) birdOp = 1;
  else if (t < 0.78) birdOp = lerp(1, 0, smoothstep(0.72, 0.78, t));
  else               birdOp = 0;

  birdsLayerEl.style.opacity = birdOp.toFixed(3);

  // Bird color: white during day, golden at sunrise/sunset
  const birdColor = (t > 0.35 && t < 0.65) ? 'rgba(200,200,200,0.7)' : 'rgba(255,200,100,0.7)';
  const birdDivs = birdsLayerEl.querySelectorAll('.bird');
  birdDivs.forEach(bird => { bird.style.color = birdColor; });

  // ──────────────────────────────────────
  // HIKERS (daytime: t 0.36 → 0.65)
  // ──────────────────────────────────────
  let hikerOp;
  if      (t < 0.36) hikerOp = 0;
  else if (t < 0.44) hikerOp = smoothstep(0.36, 0.44, t);
  else if (t < 0.62) hikerOp = 1;
  else if (t < 0.68) hikerOp = lerp(1, 0, smoothstep(0.62, 0.68, t));
  else               hikerOp = 0;
  hikersLayerEl.style.opacity = '1';  // TEST: always visible

  // Hikers match forest brightness
  hikersLayerEl.style.filter = `brightness(${fb.toFixed(3)})`;

  // ──────────────────────────────────────
  // SCOUT ACTIVITY TEXT
  // ──────────────────────────────────────
  if (frameIdx % 38 === 0) {
    const actLbl = getActivityLabel(t);
    scoutActivityEl.textContent = actLbl;
  }

  // ──────────────────────────────────────
  // TIME BADGE (throttled)
  // ──────────────────────────────────────
  if (frameIdx % 38 === 0) {
    const lbl = getLabel(t);
    if (lbl !== lastLbl) { timeBadge.textContent = lbl; lastLbl = lbl; }
  }

  // ──────────────────────────────────────
  // CLOCK (synced to cycle)
  // ──────────────────────────────────────
  if (frameIdx % 2 === 0) {  // Update every 2 frames for performance
    clockEl.textContent = getClockTime(t);
  }

  frameIdx++;

  requestAnimationFrame(tick);
}

requestAnimationFrame(tick);

// ══════════════════════════════════════════
// SPEED CONTROL
// ══════════════════════════════════════════
function setSpeed(s) {
  const now  = performance.now();
  const phase = ((now - cycleStart) % CYCLE_MS) / CYCLE_MS;
  CYCLE_MS   = s * 1000;
  cycleStart = now - phase * CYCLE_MS;
  document.querySelectorAll('.ctrl').forEach(b => {
    b.classList.toggle('active',
      (s===60 && b.textContent==='Slow') ||
      (s===20 && b.textContent==='Normal') ||
      (s===8  && b.textContent==='Fast'));
  });
}

// ══════════════════════════════════════════
// CLOCK DISPLAY (synced to day/night cycle)
// ══════════════════════════════════════════
const clockEl = document.getElementById('clock-display');
function getClockTime(t) {
  // Map cycle progress (0-1) to 24-hour time (0-24 hours)
  // 0.0 = midnight (00:00:00)
  // 0.5 = noon (12:00:00)
  const totalSeconds = t * 24 * 3600;  // Convert to seconds in 24 hours
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = Math.floor(totalSeconds % 60);
  const h = String(hours).padStart(2, '0');
  const m = String(minutes).padStart(2, '0');
  const s = String(seconds).padStart(2, '0');
  return `${h}:${m}:${s}`;
}
