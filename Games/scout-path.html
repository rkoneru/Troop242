<title>The Scout Path — Troop 242</title>
<style>
:root {
  --bg: #030c05;
  --path-gold: #c8900a;
  --path-glow: #e8b830;
  --badge-tan: #c9a870;
  --badge-inner: #b89858;
  --badge-border: #7a5010;
  --badge-dark: #5a3808;
  --text-gold: #f0d060;
  --text-green: #8ab060;
  --text-muted: #4a6a3a;
  --red-bsa: #8b1515;
  --blue-eagle: #1a2d6b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  font-family: Georgia, 'Palatino Linotype', serif;
  min-height: 100vh;
  overflow-x: hidden;
}
.page {
  max-width: 1200px;
  margin: 0 auto;
  padding-bottom: 48px;
}

/* ── Header ── */
.hdr {
  text-align: center;
  padding: 40px 24px 16px;
  position: relative;
}
.hdr-eyebrow {
  font-size: 11px;
  letter-spacing: .38em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.hdr-title {
  font-size: 48px;
  color: var(--text-gold);
  font-weight: normal;
  letter-spacing: .04em;
  line-height: 1.1;
}
.hdr-sub {
  font-size: 13px;
  color: var(--text-muted);
  letter-spacing: .22em;
  text-transform: uppercase;
  margin-top: 8px;
}

/* ── Scene ── */
.scene-wrap {
  padding: 0 20px;
  position: relative;
}
.scene-svg { width: 100%; display: block; }

/* ── Badge transitions ── */
.bw {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  opacity: 0;
  transform: scale(0.2);
  transition:
    opacity .55s cubic-bezier(.34,1.56,.64,1),
    transform .55s cubic-bezier(.34,1.56,.64,1);
  cursor: pointer;
}
.bw.on { opacity: 1; transform: scale(1); }
.bw:hover { filter: brightness(1.15); }
.blabel { opacity: 0; transition: opacity .4s .25s; font-family: Georgia, serif; }
.bw.on .blabel { opacity: 1; }

/* ── Progress ── */
.prog-wrap {
  max-width: 740px;
  margin: 18px auto 0;
  padding: 0 24px;
}
.prog-ends {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: .22em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.prog-track {
  height: 2px;
  background: #112211;
  border-radius: 1px;
  overflow: hidden;
  position: relative;
}
.prog-fill {
  height: 100%;
  background: var(--path-gold);
  width: 0%;
  border-radius: 1px;
  transition: width .25s linear;
}
.prog-rank {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: .18em;
  text-transform: uppercase;
  margin-top: 8px;
  min-height: 16px;
  transition: color .4s;
}
.prog-rank.lit { color: var(--text-gold); }

/* ── Controls ── */
.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 18px;
}
.ctrl {
  background: none;
  border: 1px solid var(--text-muted);
  color: var(--text-muted);
  padding: 7px 22px;
  border-radius: 20px;
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.ctrl:hover { border-color: var(--text-green); color: var(--text-green); }

/* ── Info overlay ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(3,12,5,.72);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.overlay.on { opacity: 1; pointer-events: auto; }
.icard {
  background: #0a1e0d;
  border: 1px solid #2a4a1a;
  border-radius: 16px;
  padding: 36px 44px 32px;
  max-width: 480px;
  width: 92%;
  text-align: center;
  position: relative;
}
.icard-num {
  font-size: 10px;
  letter-spacing: .35em;
  color: var(--text-green);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.icard-name {
  font-size: 30px;
  color: var(--text-gold);
  font-weight: normal;
  margin-bottom: 16px;
}
.icard-desc {
  font-size: 15px;
  color: #90b870;
  line-height: 1.7;
}
.icard-req {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid #1a3a1a;
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.6;
  letter-spacing: .05em;
}
.ix {
  position: absolute;
  top: 10px; right: 16px;
  background: none; border: none;
  color: var(--text-muted);
  font-size: 24px; cursor: pointer;
  line-height: 1;
}
.ix:hover { color: var(--text-gold); }
@media (max-width:600px) {
  .hdr-title { font-size: 32px; }
  .icard { padding: 28px 24px; }
}
</style>
</head>

  </div>
  <div class="prog-rank" id="pr">Click any badge to learn more</div>
</div>

<!-- Controls -->
<div class="controls">
  <button class="ctrl" id="btnP">Pause</button>
  <button class="ctrl" id="btnR">Restart</button>
</div>

</div><!-- page -->

<!-- Info overlay -->
<div class="overlay" id="ov">
  <div class="icard">
    <button class="ix" onclick="closeInfo()">×</button>
    <p class="icard-num" id="inum"></p>
    <h2 class="icard-name" id="iname"></h2>
    <p class="icard-desc" id="idesc"></p>
    <p class="icard-req" id="ireq"></p>
  </div>
</div>

<script>
// ── Rank data ──
const ranks = [
  { name:'Scout', num:'Rank 1 of 7',
    desc:'The gateway to Scouting. Scouts learn the Scout Oath, Scout Law, and discover what it means to be part of a patrol and troop.',
    req:'Complete joining requirements · Learn the Scout Oath & Law · Go on a troop outing · Learn the Outdoor Code' },
  { name:'Tenderfoot', num:'Rank 2 of 7',
    desc:'First outdoor skills take root — camping, first aid, and physical fitness — as Scouts begin building lasting patrol friendships.',
    req:'10 requirements covering camping, first aid, physical fitness, and citizenship' },
  { name:'Second Class', num:'Rank 3 of 7',
    desc:'Scouts deepen wilderness skills including navigation, cooking, and swimming safety. Leadership in the patrol grows.',
    req:'12 requirements · First aid · Map & compass · Camp cooking · Community service' },
  { name:'First Class', num:'Rank 4 of 7',
    desc:'A landmark achievement. First Class Scouts master core outdoor skills and begin leading fellow Scouts on adventures.',
    req:'13 requirements · Advanced first aid · 10-mile hike · Outdoor leadership · Community service' },
  { name:'Star', num:'Rank 5 of 7',
    desc:'Leadership and merit badge excellence define the Star Scout. Scouts hold a formal leadership role and serve their community.',
    req:'Hold a leadership position 4 months · 6 merit badges (4 Eagle-required) · 6 hrs of service' },
  { name:'Life', num:'Rank 6 of 7 — One Step Away',
    desc:'The pinnacle before Eagle. Life Scouts demonstrate consistent dedication to service, leadership, and personal growth.',
    req:'Hold leadership position 6 months · 11 merit badges · Active participation · 6 hrs of service' },
  { name:'Eagle Scout', num:'Rank 7 of 7 — The Summit',
    desc:'The highest rank in all of Scouting. Earned by fewer than 4% of Scouts, this title represents exceptional character, citizenship, and leadership. It is carried for a lifetime.',
    req:'21+ merit badges · Eagle Scout Service Project · 6 months as Life Scout · Board of Review · A legacy of service' }
];

// ── Star field ──
(function(){
  const g = document.getElementById('svgStars');
  const ns = 'http://www.w3.org/2000/svg';
  const pts = [
    [90,25],[195,15],[310,38],[425,12],[540,28],[655,10],[775,34],[890,18],[1005,40],[1065,22],
    [138,58],[270,50],[460,66],[595,44],[730,60],[885,48],[1040,55],
    [68,88],[288,78],[495,92],[710,74],[940,86],[1075,70],
    [155,108],[370,98],[620,104],[850,96],[1090,112],
    [48,130],[235,122],[500,128],[760,120],[1015,132],
    [180,22],[460,18],[740,26],[1000,16]
  ];
  const styleEl = document.createElement('style');
  styleEl.textContent = '@keyframes twk{0%,100%{opacity:.15}50%{opacity:.95}}';
  document.head.appendChild(styleEl);
  pts.forEach(([cx,cy],i)=>{
    const r = .4 + Math.random()*.9;
    const delay = (i*.41)%5;
    const dur = 1.8+(i*.17)%2.4;
    const c = document.createElementNS(ns,'circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
    c.setAttribute('fill','#f0e8c8');
    c.style.animation=`twk ${dur}s ease-in-out ${delay}s infinite`;
    g.appendChild(c);
  });
})();

// ── Trail animated draw ──
(function(){
  const t = document.getElementById('trail');
  const len = t.getTotalLength();
  t.style.strokeDasharray = len;
  t.style.strokeDashoffset = len;
  t.style.transition = 'stroke-dashoffset 15s linear';
  requestAnimationFrame(()=>{ t.style.strokeDashoffset = 0; });
})();

// ── Animation state ──
const TOTAL = 16000;
const PAUSE = 3500;
const THRESH = [0.03, 0.18, 0.32, 0.47, 0.61, 0.76, 0.93];
let revealed = Array(7).fill(false);
let animStart = null;
let paused = false;
let pauseAt = null;
let pausedOffset = 0;
let resetPending = false;
let resetTime = null;
let legT = 0;

const pathEl = document.getElementById('tp');
const pathLen = pathEl.getTotalLength();

function ptAt(p){
  return pathEl.getPointAtLength(Math.max(0, Math.min(1,p)) * pathLen);
}

function doReveal(i){
  const el = document.getElementById('b'+i);
  el.classList.add('on');
  // Update rank text
  const pr = document.getElementById('pr');
  pr.textContent = ranks[i].name.toUpperCase();
  pr.classList.add('lit');
  if(i===6) celebrate();
}

function celebrate(){
  const svg = document.querySelector('.scene-svg');
  const ns='http://www.w3.org/2000/svg';
  for(let i=0;i<12;i++){
    setTimeout(()=>{
      const c = document.createElementNS(ns,'circle');
      const ang = (i/12)*Math.PI*2;
      const d = 58+Math.random()*22;
      c.setAttribute('cx', 1008+Math.cos(ang)*d);
      c.setAttribute('cy', 150+Math.sin(ang)*d);
      c.setAttribute('r', 2.5+Math.random()*2);
      c.setAttribute('fill', i%2===0 ? '#e8c050' : '#c8102e');
      c.style.opacity='1';
      c.style.transition='opacity 1.2s, r 1.2s';
      svg.appendChild(c);
      requestAnimationFrame(()=>{ c.style.opacity='0'; });
      setTimeout(()=>{ if(c.parentNode) svg.removeChild(c); }, 1300);
    }, i*70);
  }
}

function resetAll(){
  revealed.fill(false);
  document.querySelectorAll('.bw').forEach(b=>b.classList.remove('on'));
  const pr = document.getElementById('pr');
  pr.textContent='Click any badge to learn more';
  pr.classList.remove('lit');
  document.getElementById('pf').style.width='0%';
  // reset trail
  const t = document.getElementById('trail');
  t.style.transition='none';
  t.style.strokeDashoffset=pathLen;
  requestAnimationFrame(()=>{
    t.style.transition='stroke-dashoffset 15s linear';
    requestAnimationFrame(()=>{ t.style.strokeDashoffset=0; });
  });
  // move scout back to start
  const pt = ptAt(0);
  document.getElementById('scout').setAttribute('transform',`translate(${pt.x},${pt.y-8})`);
}

function frame(ts){
  requestAnimationFrame(frame);
  if(paused) return;
  if(!animStart) animStart = ts;
  const elapsed = ts - animStart - pausedOffset;
  let prog = elapsed / TOTAL;

  if(prog >= 1){
    prog = 1;
    if(!resetTime) resetTime = ts;
    if(ts - resetTime >= PAUSE){
      animStart = ts;
      pausedOffset = 0;
      resetTime = null;
      resetAll();
      return;
    }
  }

  // Move scout
  const pt = ptAt(prog);
  document.getElementById('scout').setAttribute('transform',`translate(${pt.x},${pt.y-8})`);

  // Walk legs
  legT += 0.04;
  const swing = Math.sin(legT) * 7;
  document.getElementById('legL').setAttribute('x2', -5 + swing);
  document.getElementById('legL').setAttribute('y2', swing > 0 ? 1 : -1);
  document.getElementById('legR').setAttribute('x2', 6 - swing);
  document.getElementById('legR').setAttribute('y2', swing > 0 ? -1 : 1);

  // Progress bar
  document.getElementById('pf').style.width = (prog * 100) + '%';

  // Badge reveals
  THRESH.forEach((th,i)=>{
    if(!revealed[i] && prog >= th){
      revealed[i] = true;
      doReveal(i);
    }
  });
}

// ── Controls ──
let pauseTs = null;
document.getElementById('btnP').addEventListener('click', function(){
  paused = !paused;
  this.textContent = paused ? 'Resume' : 'Pause';
  if(paused){
    pauseTs = performance.now();
  } else {
    if(pauseTs) pausedOffset += performance.now() - pauseTs;
    pauseTs = null;
  }
});

document.getElementById('btnR').addEventListener('click', function(){
  paused = false;
  pausedOffset = 0;
  pauseTs = null;
  resetTime = null;
  document.getElementById('btnP').textContent = 'Pause';
  animStart = null;
  resetAll();
});

// ── Info overlay ──
function showInfo(i){
  const r = ranks[i];
  document.getElementById('inum').textContent = r.num;
  document.getElementById('iname').textContent = r.name;
  document.getElementById('idesc').textContent = r.desc;
  document.getElementById('ireq').textContent = r.req;
  document.getElementById('ov').classList.add('on');
}
function closeInfo(){
  document.getElementById('ov').classList.remove('on');
}
document.getElementById('ov').addEventListener('click',function(e){
  if(e.target===this) closeInfo();
});
// expose for onclick in SVG
window.showInfo = showInfo;
window.closeInfo = closeInfo;

// ── Start ──
requestAnimationFrame(frame);
</script>
</body>
</html>
