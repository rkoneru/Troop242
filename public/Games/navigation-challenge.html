<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Challenge — Troop 242</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --g: #1B4332; --gm: #2D6A4F; --gl: #52B788; --gp: #D8F3DC;
      --gold: #C8960C; --goldp: #FEF9C3; --bluep: #EFF6FF; --blue: #1E40AF;
      --red: #EF4444; --redp: #FEE2E2;
      --bg: #F7F8F5; --w: #fff; --bd: #E2E8F0; --t: #111827; --mu: #6B7280;
      --r: 14px; --sh: 0 2px 8px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--t);
      min-height: 100vh;
      padding: 20px;
    }
    header {
      background: linear-gradient(135deg, var(--blue) 0%, var(--bluep) 100%);
      color: #fff;
      padding: 40px 24px;
      text-align: center;
      border-radius: 16px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 30%, rgba(30, 64, 175, .2) 0%, transparent 55%);
      pointer-events: none;
    }
    h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }
    .sub {
      color: rgba(255, 255, 255, .7);
      font-size: 15px;
      position: relative;
      z-index: 1;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: .15s;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, .25);
      gap: 8px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    .quiz-wrapper {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .progress-bar {
      height: 6px;
      background: var(--bd);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue) 0%, var(--bluep) 100%);
      transition: width 0.3s ease;
    }

    .question-card {
      background: var(--w);
      border: 2px solid var(--bd);
      border-radius: var(--r);
      padding: 32px;
      box-shadow: var(--sh);
    }

    .question-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--t);
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .scenario-box {
      background: var(--bluep);
      border-left: 4px solid var(--blue);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--t);
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      padding: 16px 20px;
      border: 2px solid var(--bd);
      border-radius: 10px;
      background: var(--w);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
    }

    .option:hover {
      border-color: var(--blue);
      background: var(--bluep);
    }

    .option.selected {
      border-color: var(--blue);
      background: var(--bluep);
      font-weight: 600;
    }

    .option.correct {
      border-color: var(--gl);
      background: rgba(82, 183, 136, .15);
      color: var(--g);
    }

    .option.incorrect {
      border-color: var(--red);
      background: var(--redp);
      color: var(--red);
    }

    .option:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .feedback {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .feedback.correct {
      background: rgba(82, 183, 136, .15);
      color: var(--g);
      border-left: 4px solid var(--gl);
    }

    .feedback.incorrect {
      background: var(--redp);
      color: var(--red);
      border-left: 4px solid var(--red);
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      transition: all .2s ease;
      letter-spacing: .3px;
    }

    .btn-primary {
      background: var(--blue);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1E3A8A;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(30, 64, 175, .2);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .results-card {
      background: var(--bluep);
      border: 2px solid var(--blue);
      border-radius: var(--r);
      padding: 40px;
      text-align: center;
      box-shadow: var(--sh);
    }

    .results-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .score-display {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--blue);
      margin-bottom: 12px;
    }

    .score-label {
      font-size: 1.1rem;
      color: var(--blue);
      margin-bottom: 24px;
      font-weight: 600;
    }

    .result-message {
      font-size: 1.2rem;
      color: var(--t);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-box {
      background: var(--w);
      border-radius: 10px;
      padding: 16px;
      border: 1px solid var(--bd);
    }

    .stat-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--mu);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--blue);
    }

    @media (max-width: 640px) {
      header {
        padding: 32px 20px;
        margin-bottom: 32px;
      }

      .question-card {
        padding: 24px;
      }

      .score-display {
        font-size: 2.5rem;
      }

      .results-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="scout-games-hub.html" class="back-btn">← Back</a>
    <h1>🗺️ Navigation Challenge</h1>
    <p class="sub">Master compass, maps, and direction finding</p>
  </header>

  <div class="container">
    <div id="quizContainer" class="quiz-wrapper">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <div id="questionCard" class="question-card">
        <div class="question-num" id="questionNum"></div>
        <div class="question-text" id="questionText"></div>
        <div id="scenarioBox" class="scenario-box" style="display: none;"></div>
        <div class="options" id="optionsContainer"></div>
        <button id="nextBtn" class="btn btn-primary" onclick="nextQuestion()" style="display: none; margin-top: 20px;">Next Question</button>
      </div>
    </div>

    <div id="resultsScreen" style="display: none;">
      <div class="results-card">
        <div class="results-icon" id="resultsIcon">🎉</div>
        <div class="score-display" id="finalScore"></div>
        <div class="score-label">out of 10 questions</div>
        <div class="result-message" id="resultMessage"></div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Correct</div>
            <div class="stat-value" id="correctCount"></div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Accuracy</div>
            <div class="stat-value" id="accuracy"></div>
          </div>
        </div>

        <button class="btn btn-primary" onclick="resetQuiz()">Try Again</button>
      </div>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      {
        question: "Which direction does the sun rise?",
        options: ["North", "South", "East", "West"],
        correct: 2,
        explanation: "The sun always rises in the east and sets in the west. This is a basic navigation reference point."
      },
      {
        question: "A compass needle points toward...",
        options: ["Geographic North", "Magnetic North", "True North", "The sun"],
        correct: 1,
        explanation: "A compass needle points to Magnetic North, which differs from Geographic North by about 11-15 degrees depending on location."
      },
      {
        question: "You're holding a map with the north arrow pointing up. You want to go southwest. Which direction do you face?",
        options: ["Up-left corner", "Down-left corner", "Down-right corner", "Up-right corner"],
        correct: 1,
        explanation: "Southwest is down and to the left (toward the bottom-left corner of the map)."
      },
      {
        question: "What are the cardinal directions?",
        options: [
          "North, South, East, West",
          "North, Northeast, Northwest, South",
          "Up, Down, Left, Right",
          "Forward, Backward, Left, Right"
        ],
        correct: 0,
        explanation: "Cardinal directions are North, South, East, and West. Secondary directions like NE, SE, SW, NW are called intercardinal directions."
      },
      {
        question: "You see a landmark on the horizon ahead of you at 45 degrees (northeast). How do you mark this on your compass?",
        options: [
          "It's at bearing 090 degrees",
          "It's at bearing 045 degrees",
          "It's at bearing 315 degrees",
          "It's at bearing 270 degrees"
        ],
        correct: 1,
        explanation: "Bearings are measured clockwise from North. Northeast is 45 degrees."
      },
      {
        question: "Which map feature shows elevation changes?",
        options: [
          "Color changes only",
          "Contour lines",
          "Symbols and icons",
          "Roads and trails"
        ],
        correct: 1,
        explanation: "Contour lines on a topographic map show elevation. Closer lines mean steeper terrain."
      },
      {
        question: "Your map shows a grid scale of 1:50,000. One inch on the map equals how many miles?",
        options: [
          "0.5 miles",
          "0.79 miles",
          "1.5 miles",
          "2 miles"
        ],
        correct: 1,
        explanation: "At 1:50,000 scale, 1 inch ≈ 0.79 miles (or about 4/5 mile). Remember: 1:25,000 = 1.57 miles per inch."
      },
      {
        question: "You're using a compass to navigate. You align the compass orienting lines with the map grid lines. What's next?",
        options: [
          "Rotate the entire compass housing until the needle points to North",
          "Read the bearing directly from the index line",
          "Hold the compass level and rotate yourself until the needle aligns",
          "Take a bearing from the map location"
        ],
        correct: 2,
        explanation: "After orienting the compass to the map, hold it level and rotate your body until the magnetic needle aligns with the orienting lines."
      },
      {
        question: "Triangulation on a map means...",
        options: [
          "Finding three locations on a map",
          "Using three known landmarks to pinpoint your position",
          "Creating three reference points",
          "Measuring three angles"
        ],
        correct: 1,
        explanation: "Triangulation uses bearings from three visible landmarks to determine your exact position by drawing back-bearings on the map."
      },
      {
        question: "What's the main difference between a map and a compass?",
        options: [
          "Maps show terrain, compasses show direction",
          "Compasses are round, maps are rectangular",
          "Maps use colors, compasses use needles",
          "There is no difference"
        ],
        correct: 0,
        explanation: "Maps show terrain, distances, and features; compasses indicate direction. Together they enable land navigation."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
      const q = QUESTIONS[currentQuestion];
      document.getElementById('questionNum').textContent = `Question ${currentQuestion + 1} of ${QUESTIONS.length}`;
      document.getElementById('questionText').textContent = q.question;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((option, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = option;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });

      const progress = ((currentQuestion + 1) / QUESTIONS.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';

      answered = false;
      document.getElementById('nextBtn').style.display = 'none';
    }

    function selectOption(idx) {
      if (answered) return;

      answered = true;
      const q = QUESTIONS[currentQuestion];
      const options = document.querySelectorAll('.option');

      options.forEach((opt, i) => {
        opt.disabled = true;
        if (i === q.correct) {
          opt.classList.add('correct');
        } else if (i === idx) {
          opt.classList.add('incorrect');
        }
      });

      if (idx === q.correct) {
        score++;
      }

      const feedback = document.createElement('div');
      feedback.className = idx === q.correct ? 'feedback correct' : 'feedback incorrect';
      feedback.innerHTML = `<strong>${idx === q.correct ? '✓ Correct!' : '✗ Incorrect'}</strong><br>${q.explanation}`;
      document.getElementById('optionsContainer').parentElement.appendChild(feedback);

      document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < QUESTIONS.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quizContainer').style.display = 'none';
      document.getElementById('resultsScreen').style.display = 'block';

      const percentage = Math.round((score / QUESTIONS.length) * 100);

      document.getElementById('finalScore').textContent = score;
      document.getElementById('correctCount').textContent = score;
      document.getElementById('accuracy').textContent = percentage + '%';

      let message = '';
      let icon = '';
      if (percentage >= 80) {
        message = "🗺️ Excellent! You're a skilled navigator!";
        icon = '🗺️';
      } else if (percentage >= 60) {
        message = "👍 Good job! You understand navigation basics.";
        icon = '👍';
      } else if (percentage >= 40) {
        message = "📚 Keep practicing map and compass skills.";
        icon = '📚';
      } else {
        message = "🧭 Great effort! Study navigation more.";
        icon = '🧭';
      }

      document.getElementById('resultMessage').textContent = message;
      document.getElementById('resultsIcon').textContent = icon;
    }

    function resetQuiz() {
      currentQuestion = 0;
      score = 0;
      answered = false;
      document.getElementById('quizContainer').style.display = 'flex';
      document.getElementById('resultsScreen').style.display = 'none';
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
